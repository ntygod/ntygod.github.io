<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">跳到正文</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/about' | relative_url }}">关于</a>
        </nav>
      </div>
    </header>

    <main id="content" class="page-shell">
      {{ content }}
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>
      (function () {
        const selector = 'pre > code.language-mermaid, pre > code.language-mermaidjs, pre > code.language-mmd';

        function upgradeMermaidBlocks() {
          document.querySelectorAll(selector).forEach((code) => {
            const pre = code.parentElement;
            if (!pre || pre.dataset.mermaidUpgraded === 'true') {
              return;
            }

            const block = document.createElement('div');
            block.className = 'mermaid';
            block.textContent = code.textContent.trim();
            pre.dataset.mermaidUpgraded = 'true';
            pre.replaceWith(block);
          });
        }

        function renderMermaid() {
          upgradeMermaidBlocks();

          if (!window.mermaid) {
            requestAnimationFrame(renderMermaid);
            return;
          }

          mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            theme: 'base',
            themeVariables: {
              fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
              primaryColor: '#fffdf8',
              primaryTextColor: '#1c2530',
              primaryBorderColor: '#0f766e',
              lineColor: '#5d6977',
              secondaryColor: '#efe8db',
              tertiaryColor: '#f6f1e8'
            }
          });

          mermaid.run({ querySelector: '.mermaid' });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', renderMermaid);
        } else {
          renderMermaid();
        }
      })();
    </script>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>{{ site.description }}</p>
        <p>Built for GitHub Pages.</p>
      </div>
    </footer>
  </body>
</html>
