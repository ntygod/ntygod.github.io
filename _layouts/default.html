<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.hero | default: '/assets/images/hero.png' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">跳到正文</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
          <a href="{{ '/archive/' | relative_url }}"{% if page.url contains '/archive' %} aria-current="page"{% endif %}>归档</a>
          <a href="{{ '/about' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>关于</a>
        </nav>
      </div>
    </header>

    <main id="content" class="page-shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div>
          <p class="site-footer__brand">{{ site.title }}</p>
          <p>{{ site.description }}</p>
        </div>
        <nav class="site-footer__links" aria-label="页脚导航">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/archive/' | relative_url }}">归档</a>
          <a href="{{ '/about' | relative_url }}">关于</a>
        </nav>
      </div>
    </footer>

    <script>
      (function () {
        const mermaidSelector = [
          'pre > code.language-mermaid',
          'pre > code.language-mermaidjs',
          'pre > code.language-mmd',
          '.language-mermaid pre',
          '.language-mermaidjs pre',
          '.language-mmd pre'
        ].join(',');
        let mermaidScriptRequested = false;

        function loadMermaidScript() {
          if (mermaidScriptRequested) {
            return;
          }

          mermaidScriptRequested = true;
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
          script.async = true;
          script.onload = renderMermaid;
          document.head.appendChild(script);
        }

        function annotateCodeBlocks() {
          document.querySelectorAll('pre').forEach((pre) => {
            if (pre.closest('.mermaid')) {
              return;
            }

            const code = pre.querySelector('code');
            const classSource = [
              pre.className,
              code ? code.className : '',
              pre.parentElement ? pre.parentElement.className : '',
              pre.parentElement && pre.parentElement.parentElement ? pre.parentElement.parentElement.className : ''
            ].join(' ');
            const match = classSource.match(/language-([a-z0-9_-]+)/i);

            if (!match) {
              return;
            }

            const language = match[1].toLowerCase();
            if (['mermaid', 'mermaidjs', 'mmd'].includes(language)) {
              return;
            }

            pre.dataset.language = language === 'plaintext' ? 'TEXT' : language.toUpperCase();
          });
        }

        function upgradeMermaidBlocks() {
          document.querySelectorAll(mermaidSelector).forEach((node) => {
            const pre = node.matches('pre') ? node : node.closest('pre');
            if (!pre) {
              return;
            }

            const wrapper = pre.closest('.language-mermaid, .language-mermaidjs, .language-mmd');
            const target = wrapper && wrapper.querySelector('pre') === pre ? wrapper : pre;
            if (target.dataset.mermaidUpgraded === 'true') {
              return;
            }

            const block = document.createElement('div');
            block.className = 'mermaid';
            block.textContent = pre.textContent.trim();
            target.dataset.mermaidUpgraded = 'true';
            target.replaceWith(block);
          });
        }

        function renderMermaid() {
          upgradeMermaidBlocks();
          annotateCodeBlocks();

          if (!document.querySelector('.mermaid')) {
            return;
          }

          if (!window.mermaid) {
            loadMermaidScript();
            return;
          }

          mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            theme: 'base',
            themeVariables: {
              fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
              primaryColor: '#ffffff',
              primaryTextColor: '#1f2933',
              primaryBorderColor: '#087f75',
              lineColor: '#60707d',
              secondaryColor: '#e7f0ee',
              tertiaryColor: '#f5faf8'
            }
          });

          try {
            mermaid.run({ querySelector: '.mermaid' });
          } catch (error) {
            console.warn('Mermaid render failed:', error);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', renderMermaid);
        } else {
          renderMermaid();
        }
      })();
    </script>
  </body>
</html>
